name: Sonde API (temporaire)
on:
  push:
    branches: [claude/sonde-api]
jobs:
  geocodeurs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Géocodeurs
        shell: bash
        run: |
          set +e
          p() { curl -sS -m 20 -A "diagnostic-site (github.com/esope023/diagnostic-site)" -H "Origin: https://esope023.github.io" -D /tmp/h -o /tmp/b -w "HTTP %{http_code} %{time_total}s redir=%{redirect_url}\n" "$1"; echo "  $1"; grep -i "^access-control-allow-origin" /tmp/h; head -c 400 /tmp/b; echo; echo; }
          for i in 1 2 3; do p "https://data.geopf.fr/geocodage/search?q=2%20rue%20jean%2013004%20marseille&limit=1"; done
          p "https://data.geopf.fr/geocodage/search?q=2%20rue%20jean%2013004%20marseille&limit=5&autocomplete=1"
          p "https://data.geopf.fr/geocodage/completion?text=2%20rue%20jean%20marseille&maximumResponses=5"
          p "https://api-adresse.data.gouv.fr/search/?q=2%20rue%20jean%2013004%20marseille&limit=1"
          p "https://photon.komoot.io/api/?q=2%20rue%20jean%2013004%20marseille&limit=3&lang=fr"
          p "https://nominatim.openstreetmap.org/search?q=2%20rue%20jean%2013004%20marseille&format=jsonv2&limit=1&countrycodes=fr&addressdetails=1"
          p "https://geo.api.gouv.fr/communes?lat=43.3033&lon=5.4031&fields=code,nom,codesPostaux"
          p "https://data.geopf.fr/altimetrie/1.0/calcul/alti/rest/elevation.json?lon=5.4031&lat=43.3033&resource=ign_rge_alti_wld&zonly=true"
          p "https://apicarto.ign.fr/api/gpu/municipality?insee=13055"
