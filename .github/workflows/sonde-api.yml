name: Sonde API (temporaire)
on:
  push:
    branches: [claude/sonde-api]
jobs:
  couches:
    runs-on: ubuntu-latest
    steps:
      - name: Couches
        shell: bash
        run: |
          set +e
          curl -s "https://data.geopf.fr/wms-v/ows?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0" -o wmsv.xml
          python3 - <<'PY'
          import re
          x=open('wmsv.xml').read()
          # Couches GPU : titre et résumé
          for m in re.finditer(r'<Layer[^>]*>\s*<Name>([a-z_]+)</Name>\s*<Title>([^<]*)</Title>(?:\s*<Abstract>([^<]*)</Abstract>)?', x):
              n,t,a=m.groups()
              if n.startswith('default') or n.endswith('wmsv'): continue
              print(n,'|',t[:60],'|',(a or '')[:70])
          PY
          B="BBOX=597000,5370000,598000,5371000&WIDTH=256&HEIGHT=256&FORMAT=image/png&TRANSPARENT=true&CRS=EPSG:3857&STYLES="
          for L in du zone_secteur prescription info monument_historique eaux; do
            curl -s -o t.bin "https://data.geopf.fr/wms-v/ows?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=$L&$B"; echo "$L : $(file -b t.bin | cut -c1-30) $(stat -c %s t.bin)"; done
          for T in PM PM_6_13; do curl -s -o t.bin "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=$T&TILEMATRIX=12&TILEROW=1498&TILECOL=2109&LAYER=Natura_2000&FORMAT=image/png"; echo "natura $T : $(file -b t.bin | cut -c1-30)"; done
          for T in PM PM_6_16; do curl -s -o t.bin "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=$T&TILEMATRIX=15&TILEROW=11992&TILECOL=16878&LAYER=IGNF_BD-FRANCE-TOPO-VEGETATION&FORMAT=image/png"; echo "vegetation $T : $(file -b t.bin | cut -c1-30)"; done
