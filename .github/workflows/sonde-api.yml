name: Sonde API (temporaire)
on:
  push:
    branches: [claude/sonde-api]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/corrections-sources }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
        env: { GH_PAGES_BASE: /diagnostic-site/ }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Test réel
        shell: bash
        run: |
          set +e
          npx vite preview --port 4173 --base /diagnostic-site/ & sleep 4
          cat > t.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const p = await b.newPage({ viewport:{width:390,height:844}, userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1' });
            const t0 = Date.now(); const log = (...a) => console.log(((Date.now()-t0)/1000).toFixed(1)+'s', ...a);
            p.on('console', m => { if (m.type()==='error') log('CONSOLE', m.text().slice(0,200)); });
            p.on('requestfailed', r => log('ECHEC', r.url().slice(0,110), r.failure()?.errorText));
            p.on('response', r => { const u=r.url(); if (!u.includes('localhost')) log('HTTP', r.status(), u.slice(0,110)); });
            await p.goto('http://localhost:4173/diagnostic-site/');
            await p.fill('#search-input', '2 rue jean 13004 marseille');
            await p.waitForSelector('.address-suggestions li[role=option]', {timeout:20000});
            await p.keyboard.press('Enter');
            const until = Date.now()+200000;
            let last='';
            while (Date.now()<until) {
              const st = await p.$$eval('.module-card', cs=>cs.map(c=>c.querySelector('.module-title').textContent.trim()+'='+c.dataset.status).join(' | '));
              if (st!==last) { log('ETAT', st); last=st; }
              if (st && !st.includes('loading')) break;
              await p.waitForTimeout(2000);
            }
            log('SITE', await p.textContent('#site-info'));
            await p.click('.modules-toolbar button[data-open=true]');
            await p.waitForTimeout(1500);
            for (const c of await p.$$('.module-card')) {
              const txt = (await c.innerText()).replace(/\n+/g,' ¶ ').slice(0,1400);
              console.log('\n===== ' + txt);
            }
            console.log('\n===== LIEN REGLEMENT', await p.$eval('a[href*="pdf"], a[href*="Reglement"]', a=>a.href).catch(()=> 'aucun'));
            console.log('MARQUEUR', await p.$eval('.site-marker svg', s=>s.getBoundingClientRect().width).catch(()=> 'absent'));
            console.log('SYNTHESE', (await p.innerText('#synthese')).replace(/\n+/g,' ¶ ').slice(0,1500));
            await b.close();
          })();
          JS
          node t.cjs
