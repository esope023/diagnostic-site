name: Sonde API (temporaire)
on:
  push:
    branches: [claude/sonde-api]
jobs:
  legende:
    runs-on: ubuntu-latest
    steps:
      - name: Légende CoSIA
        shell: bash
        run: |
          set +e
          for U in \
            "https://data.geopf.fr/wms-r/wms?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetLegendGraphic&LAYER=IGNF_COSIA_2021-2023&FORMAT=image/png&SLD_VERSION=1.1.0" \
            "https://data.geopf.fr/wms-r/wms?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetLegendGraphic&LAYER=IGNF_COSIA_2021-2023&FORMAT=image/png" \
            "https://data.geopf.fr/wms-r/wms?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetLegendGraphic&LAYER=IGNF_COSIA_2021-2023&FORMAT=image/gif&STYLE=normal" ; do
            curl -s -D h.txt -o l.bin -H "Origin: https://esope023.github.io" "$U"; echo "$(grep -iE '^HTTP|access-control-allow-origin' h.txt | tr -d '\r' | tr '\n' ' ') $(file -b l.bin | cut -c1-60)"; done
          curl -s "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetCapabilities" -o wmts.xml
          python3 - <<'PY'
          x=open('wmts.xml').read()
          i=x.find('<ows:Identifier>IGNF_COSIA_2021-2023</ows:Identifier>'); j=x.rfind('<Layer>',0,i); k=x.find('</Layer>',i)
          import re; print(re.findall(r'<LegendURL[^>]*>', x[j:k])[:3])
          PY
