name: Sonde API (temporaire)
on:
  push:
    branches: [claude/sonde-api]
jobs:
  couches:
    runs-on: ubuntu-latest
    steps:
      - name: CoSIA
        shell: bash
        run: |
          set +e
          curl -s "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetCapabilities" -o wmts.xml
          curl -s "https://data.geopf.fr/wms-r/wms?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0" -o wmsr.xml
          curl -s "https://data.geopf.fr/wms-v/ows?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0" -o wmsv.xml
          python3 - <<'PY'
          import re
          for f in ['wmts.xml','wmsr.xml','wmsv.xml']:
              x=open(f).read()
              ids=set(re.findall(r'<(?:ows:Identifier|Name)>([^<]*COSIA[^<]*|[^<]*OCSGE[^<]*|[^<]*[Cc]osia[^<]*)</', x))
              print(f, sorted(ids)[:40])
              for n in sorted(ids)[:12]:
                  i=x.find('>'+n+'<'); j=x.rfind('<Layer',0,i); k=x.find('</Layer>',i); blk=x[j:k]
                  print('  ',n,'| formats',re.findall(r'<Format>([^<]*)',blk)[:2],'| tms',re.findall(r'<TileMatrixSet>([^<]*)',blk)[:2],'| styles',re.findall(r'<Style[^>]*>.*?<(?:ows:Identifier|Name)>([^<]*)',blk,re.S)[:2],'| titre',re.findall(r'<(?:ows:Title|Title)>([^<]*)',blk)[:1])
          PY
