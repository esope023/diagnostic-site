name: Sonde API (temporaire)
on:
  push:
    branches: [claude/sonde-api]
jobs:
  gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API Carto GPU
        shell: bash
        run: |
          set +e
          PT='%7B%22type%22%3A%22Point%22%2C%22coordinates%22%3A%5B5.403146%2C43.303347%5D%7D'
          p() { curl -sS -m 25 -H "Origin: https://esope023.github.io" -D /tmp/h -o /tmp/b -w "HTTP %{http_code} %{time_total}s redir=%{redirect_url}\n" "$1"; echo "  $1"; grep -i "^access-control-allow-origin\|^content-type" /tmp/h; head -c 350 /tmp/b | tr '\n' ' '; echo; echo; }
          p "https://apicarto.ign.fr/api/gpu/zone-urba?geom=$PT"
          p "https://apicarto.ign.fr/api/gpu/assiette-sup-s?geom=$PT"
          p "https://apicarto.ign.fr/api/gpu/municipality?insee=13204"
          p "https://apicarto.ign.fr/api/nature/znieff1?geom=$PT"
          p "https://apicarto.ign.fr/api/"
          p "https://data.geopf.fr/apicarto/gpu/zone-urba?geom=$PT"
          p "https://data.geopf.fr/api-carto/gpu/zone-urba?geom=$PT"
          p "https://www.geoportail-urbanisme.gouv.fr/api/feature-info/du?lon=5.403146&lat=43.303347"
          p "https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=wfs_du:zone_urba&OUTPUTFORMAT=application/json&SRSNAME=EPSG:4326&COUNT=2&BBOX=5.4030,43.3032,5.4033,43.3035,EPSG:4326"
          p "https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetCapabilities" 
          grep -o "<Name>wfs_\(du\|sup\)[^<]*</Name>" /tmp/b | head -20
          p "https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=wfs_sup:assiette_sup_s&OUTPUTFORMAT=application/json&SRSNAME=EPSG:4326&COUNT=3&BBOX=5.4030,43.3032,5.4033,43.3035,EPSG:4326"
