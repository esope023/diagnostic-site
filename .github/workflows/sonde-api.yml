name: Sonde API (temporaire)
on:
  push:
    branches: [claude/sonde-api]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/mise-en-page }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
        env: { GH_PAGES_BASE: /diagnostic-site/ }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Export
        shell: bash
        run: |
          set +e
          mkdir -p shots dl
          npx vite preview --port 4173 --base /diagnostic-site/ & sleep 4
          cat > t.cjs <<'JS'
          const pw = require('playwright');
          (async () => {
            const b = await pw.chromium.launch();
            for (const [name, opts] of [['bureau', { viewport:{width:1280,height:800} }], ['mobile', { ...pw.devices['iPhone 14'] }]]) {
              const t0=Date.now(); const log=(...a)=>console.log(((Date.now()-t0)/1000).toFixed(1)+'s',name,...a);
              const c = await b.newContext(opts); const p = await c.newPage();
              try {
                await p.goto('http://localhost:4173/diagnostic-site/', { waitUntil:'domcontentloaded', timeout:60000 });
                await p.fill('#search-input', '2 rue jean 13004 marseille');
                await p.waitForSelector('.address-suggestions li[role=option]', {timeout:20000});
                await p.keyboard.press('Enter');
                await p.waitForSelector('.map-atelier:not([hidden])', {timeout:60000});
                await p.click('.map-atelier'); await p.waitForFunction(()=>/périmètre/.test(document.querySelector('.at-site')?.textContent||''), null, {timeout:60000}); await p.waitForTimeout(3000);
                await p.click('.mp-bouton'); await p.waitForTimeout(7000);
                log('ETAT', JSON.stringify(await p.evaluate(() => { const m = document.querySelector('#vue-atelier').__carte;
                  const f = m.getSource('cadre')._data.features.find(x=>x.properties.role==='cadre').geometry.coordinates.map(c=>m.project(c));
                  const xs=f.map(q=>Math.round(q.x)), ys=f.map(q=>Math.round(q.y)); const c = m.getContainer();
                  const pan = document.querySelector('.mp-panneau').getBoundingClientRect(), car = c.getBoundingClientRect();
                  return { cadreX:[Math.min(...xs),Math.max(...xs)], cadreY:[Math.min(...ys),Math.max(...ys)], carte:[Math.round(car.width),Math.round(car.height)], panneau:{x:Math.round(pan.left-car.left), y:Math.round(pan.top-car.top)}, padding: m.getPadding() }; })));
                await p.screenshot({ path:`shots/ui-${name}.jpg`, quality:60, timeout:60000 }).catch(e=>log('capture', e.message.split('\n')[0]));
              } catch(e) { log('ECHEC', e.message.split('\n')[0]); }
              await c.close();
            }
            await b.close();
          })();
          JS
          node t.cjs
          python3 -c "
          import base64,glob,time
          for f in sorted(glob.glob('shots/*.jpg')):
              b=base64.b64encode(open(f,'rb').read()).decode()
              print('IMGSTART',f.split('/')[-1],flush=True)
              for i in range(0,len(b),20000): print(b[i:i+20000],flush=True); time.sleep(0.05)
              print('IMGEND',f.split('/')[-1],flush=True)
          "
