name: Sonde API (temporaire)
on:
  push:
    branches: [claude/sonde-api]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/arbres-proportions }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
        env: { GH_PAGES_BASE: /diagnostic-site/ }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Arbres
        shell: bash
        run: |
          set +e
          mkdir -p shots
          npx vite preview --port 4173 --base /diagnostic-site/ & sleep 4
          cat > t.cjs <<'JS'
          const pw = require('playwright');
          (async () => {
            const b = await pw.chromium.launch();
            const log=(...a)=>console.log(...a);
            const c = await b.newContext({ viewport:{width:1100,height:760} }); const p = await c.newPage();
            await p.route(/overpass|maps\.mail\.ru/, (route) => {
              const u = decodeURIComponent(route.request().url());
              if (!/natural.*tree/.test(u)) return route.continue();
              const m = u.match(/around:(\d+),([\d.]+),([\d.]+)/); const lat0 = +m[2], lon0 = +m[3], els = [];
              const k = 111320 * Math.cos(lat0*Math.PI/180);
              // alignement le long d'une rue, tous les 8 m, sans dimensions (taille générique)
              for (let i = 0; i < 18; i++) els.push({ type:'node', id:i, lat: lat0 - 12/110540, lon: lon0 + (-70 + i*8)/k, tags: i%6===5 ? { leaf_type:'needleleaved' } : {} });
              route.fulfill({ status:200, contentType:'application/json', headers:{'access-control-allow-origin':'*'}, body: JSON.stringify({ elements: els }) });
            });
            await p.goto('http://localhost:4173/diagnostic-site/', { waitUntil:'domcontentloaded', timeout:60000 });
            await p.fill('#search-input', '2 rue jean 13004 marseille');
            await p.waitForSelector('.address-suggestions li[role=option]', {timeout:20000});
            await p.keyboard.press('Enter');
            await p.waitForSelector('.map-atelier:not([hidden])', {timeout:60000});
            await p.click('.map-atelier');
            await p.waitForFunction(()=>/périmètre/.test(document.querySelector('.at-site')?.textContent||''), null, {timeout:60000});
            for (const id of ['cadastre']) await p.click(`[data-couche="${id}"] .switch`);
            await p.click('.at-replier');
            await p.click('.at-mode button[data-mode="3d"]');
            await p.waitForTimeout(2500);
            await p.evaluate(() => { const m = document.querySelector('#vue-atelier').__carte; const c = m.getCenter(); m.jumpTo({ center: [c.lng, c.lat - 0.0002], zoom: 18.6, pitch: 62, bearing: -15 }); });
            await p.waitForTimeout(6000);
            log('arbres', await p.innerText('[data-couche="arbres"] .at-etat').catch(()=>''));
            await p.locator('.at-canvas canvas').screenshot({ path:'shots/arbres.jpg', quality:70, timeout:60000 }).catch(e=>log('capture', e.message.split('\n')[0]));
            await b.close();
          })();
          JS
          node t.cjs
          python3 -c "
          import base64,glob,time
          for f in sorted(glob.glob('shots/*.jpg')):
              b=base64.b64encode(open(f,'rb').read()).decode()
              print('IMGSTART',f.split('/')[-1],flush=True)
              for i in range(0,len(b),20000): print(b[i:i+20000],flush=True); time.sleep(0.05)
              print('IMGEND',f.split('/')[-1],flush=True)
          "
