name: Sonde API (temporaire)
on:
  push:
    branches: [claude/sonde-api]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/carte-3d }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
        env: { GH_PAGES_BASE: /diagnostic-site/ }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Test réel vue 3D
        shell: bash
        run: |
          set +e
          npx vite preview --port 4173 --base /diagnostic-site/ & sleep 4
          cat > t.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch({ args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'] });
            for (const [name,vw,vh] of [['desktop',1280,860],['mobile',390,844]]) {
              const p = await b.newPage({ viewport:{width:vw,height:vh} });
              const t0=Date.now(); const log=(...a)=>console.log(((Date.now()-t0)/1000).toFixed(1)+'s',name,...a);
              p.on('pageerror', e=>log('PAGEERROR', e.message.slice(0,200)));
              p.on('console', m=>{ if (m.type()==='error') log('CONSOLE', m.text().slice(0,160)); });
              p.on('response', r=>{ const u=r.url(); if (/geocodage|BDTOPO|wmts/.test(u) && r.status()!==200) log('HTTP', r.status(), u.slice(0,100)); });
              await p.goto('http://localhost:4173/diagnostic-site/');
              await p.fill('#search-input', '2 rue jean 13004 marseille');
              await p.waitForSelector('.address-suggestions li[role=option]', {timeout:30000}).catch(()=>log('pas de suggestion, envoi direct'));
              await p.keyboard.press('Enter');
              await p.waitForFunction(()=>!document.querySelector('.map-mode button[data-mode="3d"]').disabled, null, {timeout:30000});
              await p.click('.map-mode button[data-mode="3d"]');
              await p.waitForFunction(()=>/bâtiments|indisponibles/.test(document.querySelector('.m3d-source')?.textContent||''), null, {timeout:90000}).catch(()=>log('TIMEOUT source'));
              await p.waitForTimeout(6000);
              log('SOURCE', await p.textContent('.m3d-source'));
              log('SOLEIL', (await p.textContent('.m3d-sun-info')).replace(/\s+/g,' '));
              const shot = async (tag) => { const buf = await p.locator('.map-wrap').screenshot({ type:'jpeg', quality:55 }); console.log('IMG '+name+'-'+tag+' '+buf.toString('base64')); };
              await shot('plan');
              if (name==='desktop') {
                await p.click('.m3d-presets button[data-md="06-21"]');
                await p.$eval('.m3d-hour', el=>{ el.value='17'; el.dispatchEvent(new Event('input')); });
                await p.check('input[name="m3d-base"][value="ortho"]');
                await p.waitForTimeout(6000);
                log('SOLEIL 21/06 17h', (await p.textContent('.m3d-sun-info')).replace(/\s+/g,' '));
                await shot('ortho-juin');
              }
              await p.close();
            }
            await b.close();
          })();
          JS
          node t.cjs
