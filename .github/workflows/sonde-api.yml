name: Sonde API (temporaire)
on:
  push:
    branches: [claude/sonde-api]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/atelier-arbres }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
        env: { GH_PAGES_BASE: /diagnostic-site/ }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Atelier
        shell: bash
        run: |
          set +e
          mkdir -p shots
          npx vite preview --port 4173 --base /diagnostic-site/ & sleep 4
          cat > t.cjs <<'JS'
          const pw = require('playwright');
          const debord = () => { const W = document.documentElement.clientWidth; const out = [];
            for (const el of document.querySelectorAll('body *')) { const r = el.getBoundingClientRect(); if (r.width && r.right > W + 1 && getComputedStyle(el).visibility !== 'hidden') out.push((el.className && typeof el.className === 'string' ? el.className.split(' ')[0] : el.tagName) + ':' + Math.round(r.right) + ' (l' + Math.round(r.width) + ')'); }
            return { W, scrollW: document.documentElement.scrollWidth, bodyW: document.body.scrollWidth, out: out.slice(0, 25) }; };
          (async () => {
            for (const [nomNav, nav] of [["chromium", pw.chromium]]) {
              const b = await nav.launch();
              const name = 'iphone-' + nomNav; const t0=Date.now(); const log=(...a)=>console.log(((Date.now()-t0)/1000).toFixed(1)+'s',name,...a);
              const c = await b.newContext({ ...pw.devices['iPhone 14'] }); const p = await c.newPage();
              // Arbres fictifs autour du site (le serveur Overpass ne répond pas aux machines de test).
              await p.route(/overpass|maps\.mail\.ru/, (route) => {
                const u = decodeURIComponent(route.request().url());
                if (!/natural.*tree/.test(u)) return route.continue();
                const m = u.match(/around:(\d+),([\d.]+),([\d.]+)/); const lat0 = +m[2], lon0 = +m[3], els = [];
                // Deux alignements de part et d'autre du site, et un bosquet de 3 rangs.
                for (let i = 0; i < 60; i++) { const ring = 30 + 6 * Math.floor(i / 20); const a = (i % 20) / 20 * 2 * Math.PI;
                  els.push({ type:'node', id:i, lat: lat0 + ring * Math.cos(a) / 110540, lon: lon0 + ring * Math.sin(a) / (111320 * Math.cos(lat0*Math.PI/180)), tags: i%9===0 ? { leaf_type:'needleleaved', height:'18' } : { height: String(14 + (i%5)*2), diameter_crown: String(8 + (i%3)*2) } }); }
                route.fulfill({ status:200, contentType:'application/json', headers:{'access-control-allow-origin':'*'}, body: JSON.stringify({ elements: els }) });
              });
              p.on('pageerror', e=>log('PAGEERROR', e.message.slice(0,200)));
              p.on('console', m=>{ if (m.type()==='error' && !/Failed to load resource/.test(m.text())) log('CONSOLE', m.text().slice(0,160)); });
              try {
                await p.goto('http://localhost:4173/diagnostic-site/', { waitUntil:'domcontentloaded', timeout:60000 });
                await p.fill('#search-input', '2 rue jean 13004 marseille');
                await p.waitForSelector('.address-suggestions li[role=option]', {timeout:20000}).catch(()=>log('pas de suggestions'));
                await p.keyboard.press('Enter');
                await p.waitForSelector('.map-atelier:not([hidden])', {timeout:60000});
                log('DIAGNOSTIC', JSON.stringify(await p.evaluate(debord)));
                await p.click('.map-atelier');
                await p.waitForTimeout(5000);
                log('ATELIER', JSON.stringify(await p.evaluate(debord)));
                await p.click('.at-mode button[data-mode="3d"]'); await p.waitForTimeout(2000);
                await p.waitForFunction(()=>!/Chargement/.test(document.querySelector('[data-couche="arbres"] .at-etat')?.textContent||''), null, {timeout:90000}).catch(()=>log('arbres encore en chargement'));
                log('arbres', await p.innerText('[data-couche="arbres"] .at-etat').catch(()=>''));
                await p.evaluate(()=>{}); await p.waitForTimeout(1500);
                log('site', await p.innerText('.at-site'));
                log('ATELIER 3D', JSON.stringify(await p.evaluate(debord)));
                if (nomNav === 'chromium') await p.locator('.at-canvas canvas').screenshot({ path:`shots/${name}-3d.jpg`, quality:65, timeout:60000 }).catch(e=>log('capture', e.message.split('\n')[0]));
              } catch(e) { log('ECHEC', e.message.split('\n')[0]); }
              await b.close();
            }
          })();
          JS
          node t.cjs
          python3 -c "
          import base64,glob,sys,time
          for f in sorted(glob.glob('shots/*.jpg')):
              b=base64.b64encode(open(f,'rb').read()).decode()
              print('IMGSTART',f.split('/')[-1],flush=True)
              for i in range(0,len(b),20000): print(b[i:i+20000],flush=True); time.sleep(0.05)
              print('IMGEND',f.split('/')[-1],flush=True)
          "
