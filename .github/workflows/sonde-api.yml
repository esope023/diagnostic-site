name: Sonde API (temporaire)
on:
  push:
    branches: [claude/sonde-api]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/correctifs-heliodon-reglementaire }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
        env: { GH_PAGES_BASE: /diagnostic-site/ }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Test réel
        shell: bash
        run: |
          set +e
          npx vite preview --port 4173 --base /diagnostic-site/ & sleep 4
          cat > t.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch({ args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'] });
            const p = await b.newPage({ viewport:{width:1280,height:900} });
            const t0=Date.now(); const log=(...a)=>console.log(((Date.now()-t0)/1000).toFixed(1)+'s',...a);
            p.on('pageerror', e=>log('PAGEERROR', e.message.slice(0,200)));
            // Panne simulée d'API Carto GPU : le secours WFS doit prendre le relais.
            await p.route('**/apicarto.ign.fr/api/gpu/**', r => r.fulfill({ status: 503, body: 'panne simulée' }));
            p.on('response', r=>{ const u=r.url(); if (/wfs_du|wfs_sup|geocodage\/reverse|photon.*reverse|geo\.api/.test(u)) log('HTTP', r.status(), u.slice(0,120)); });
            await p.goto('http://localhost:4173/diagnostic-site/');
            await p.fill('#search-input', '2 rue jean 13004 marseille');
            await p.waitForSelector('.address-suggestions li[role=option]', {timeout:20000}).catch(()=>{});
            await p.keyboard.press('Enter');
            await p.waitForFunction(()=>{ const c=[...document.querySelectorAll('.module-card')].find(c=>c.textContent.includes('Réglementaire')); return c && c.dataset.status && c.dataset.status!=='loading'; }, null, {timeout:120000}).catch(()=>log('attente Réglementaire'));
            const reg = await p.$$eval('.module-card', cs=>cs.filter(c=>c.textContent.includes('Réglementaire')).map(c=>{ c.querySelector('.module-toggle').click(); return c.innerText.replace(/\n+/g,' ¶ ').slice(0,700); }));
            log('REGLEMENTAIRE (API Carto en panne simulée)', reg[0]);
            // Déplacement du repère de ~120 px vers le nord-est
            const m = await p.locator('.leaflet-marker-icon.site-marker').boundingBox();
            await p.mouse.move(m.x+m.width/2, m.y+m.height/2); await p.mouse.down();
            await p.mouse.move(m.x+m.width/2+90, m.y+m.height/2-80, {steps:12}); await p.mouse.up();
            await p.waitForTimeout(500);
            log('BARRE', await p.isVisible('.move-bar'), await p.textContent('.move-bar-text'));
            await p.click('.move-bar-go');
            await p.waitForFunction(()=>/Point placé/.test(document.querySelector('#site-info')?.textContent||''), null, {timeout:30000}).catch(()=>log('pas de point placé'));
            log('SITE', await p.textContent('#site-info'));
            // Héliodon
            const h = await b.newPage({ viewport:{width:1280,height:800} });
            h.on('pageerror', e=>log('HELIO PAGEERROR', e.message.slice(0,200)));
            await h.goto('http://localhost:4173/diagnostic-site/heliodon.html?addr=2%20Rue%20Jean%2013004%20Marseille&lat=43.303347&lon=5.403146');
            let last='';
            for (let i=0;i<40;i++) { const st=await h.textContent('#status'); if (st!==last){ log('HELIO', st); last=st; } if (/arbres(?! en cours)/.test(st)) break; await h.waitForTimeout(2000); }
            await b.close();
          })();
          JS
          node t.cjs
